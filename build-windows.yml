name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Choir-VST3-Windows
          path: build/Choir_artefacts/Release/VST3/Choir.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Choir-Standalone-Windows
          path: build/Choir_artefacts/Release/Standalone/Choir.exe
